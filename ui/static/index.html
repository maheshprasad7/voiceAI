<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVAHAAN Voice Agent</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.js"></script>
</head>
<body>
    <div class="siri-container">
        <!-- Orb Container (Top Center) -->
        <div class="orb-section">
            <div class="orb-wrapper">
                <div id="siriOrb" class="orb listening"></div>
            </div>
            <div class="status-label" id="statusLabel">Connecting...</div>
        </div>

        <!-- Live Conversation Transcript -->
        <div class="transcript-section" id="transcriptSection">
            <div class="transcript-list" id="transcriptList">
                <!-- Transcript entries will be appended here -->
            </div>
        </div>
    </div>

    <!-- Debug logs (Bottom Corner) -->
    <div class="debug-overlay">
        <div class="logs" id="logContainer"></div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
